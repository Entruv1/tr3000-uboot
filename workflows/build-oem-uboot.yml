# 云端编译「能安全刷原厂固件」的 U-Boot（FIP）
#
# 用法：
#   1. 本文件放到仓库的 .github/workflows/ 下
#   2. 0001-uboot-add-oem-firmware-restore.patch 放到仓库根目录
#   3. Actions -> Build OEM-flashable U-Boot (FIP) -> Run workflow
#
# 产物：Artifacts 里的
#   fip-mt7981_cudy_tr3000-v1-256mb_2025-Yuzhii-dhcpd-fixed-parts_md5-<hash>.bin

name: Build OEM-flashable U-Boot (FIP)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/weekdaycare/bl-mt798x-dhcpd
  UPSTREAM_REF: master
  BOARD: cudy_tr3000-v1-256mb
  FIP_VERSION: "2025"
  VARIANT: default
  PATCH_FILE: 0001-uboot-add-oem-firmware-restore.patch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 取出本仓库（含补丁）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 克隆上游 U-Boot 源码
        run: |
          set -e
          git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_REPO" src
          echo "src/ 顶层：$(ls src | tr '\n' ' ')"

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get -qq update
          sudo apt-get -qq install $(cat src/depends/ubuntu-22.04)
          sudo apt-get -qq install rename tar

      - name: 应用补丁
        run: |
          set -e
          P="$GITHUB_WORKSPACE/$PATCH_FILE"
          test -f "$P" || { echo "找不到补丁：$P"; exit 1; }
          cd src
          if git apply --verbose "$P"; then
            echo "==> git apply 成功"
          elif git apply --ignore-whitespace "$P"; then
            echo "==> git apply --ignore-whitespace 成功"
          else
            echo "==> 退回 patch -p1"
            patch -p1 -l < "$P"
          fi

      - name: 校验补丁已生效
        run: |
          set -e
          C=src/uboot-mtk-20250711/board/mediatek/common
          grep -q "mtd_part_has_ubi_image" "$C/mtd_helper.c"
          grep -q "generic_mtd_write_oem"  "$C/bootmenu_mtd_common.c"
          grep -q "generic_mtd_write_oem"  "$C/bootmenu_common.h"
          grep -q 'abbr = "oem"'           "$C/bootmenu_mtd.c"
          echo "==> 补丁校验通过：4 个文件全部命中"

      - name: 编译 FIP
        run: |
          set -eo pipefail
          cd src
          BOARD="$BOARD" VERSION="$FIP_VERSION" VARIANT="$VARIANT" \
            MULTI_LAYOUT=0 FIXED_MTDPARTS=1 ./build.sh 2>&1 | tee ../build.log

      - name: 打印关键信息
        if: always()
        run: |
          grep -m1 "Features:" build.log || true
          ls -l src/output || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fip-cudy-tr3000-v1-256mb-oem-capable
          path: |
            src/output/*.bin
            build.log
          if-no-files-found: error
          retention-days: 30
