# 云端编译「一个 U-Boot 通吃」的 Cudy TR3000 v1 256MB 固件（FIP）
#
# 用法：
#   1. 本文件放在仓库的 .github/workflows/ 下
#   2. 0001..0006 六个补丁放在仓库根目录
#   3. Actions -> Build OEM-flashable U-Boot (FIP) -> Run workflow
#
# 产物：Artifacts 里的
#   fip-mt7981_cudy_tr3000-v1-256mb_2025-Yuzhii-dhcpd-fixed-parts-multi-layout_md5-<hash>.bin
#   （以及 MD5SUMS.txt；同一个 zip 里的 bl2-*.bin 不要刷，本仓库补丁不涉及 BL2）
#
# 六个补丁的分工：
#   0001  让网页 failsafe 能「原样直写」整份原厂 UBI 镜像（写进去不被 U-Boot 自己擦掉）
#   0002  让这台 U-Boot 真的会去引导：补回缺失的 bootcmd
#   0003  上传原厂整包（FIP + UBI）时自动切割出 UBI 载荷再直写
#   0004  Cudy TR3000 256MB 的多布局支持（MULTI_LAYOUT）：
#         · 新增 mt7981_cudy_tr3000-v1-256mb_multi_layout_defconfig
#         · DTS 增加 /mtd-layout（default = 原厂分区；112m = 112MiB 大分区）
#         · vendor 引导命令行改由布局提供，并可用 env `vendor_bootargs` 现场覆盖
#   0005  去掉 0004 给 default 布局写的那条 cmdline —— 原厂 U-Boot 压根不设
#         bootargs，原厂内核收到的就是 FIT 自带的 /chosen/bootargs。env 一旦有
#         bootargs，fdt_chosen() 就会整体替换掉 FIT 那条，属于纯多余的偏离。
#   0006  把 default 布局的 ubi 分区从 `-(ubi)` 改成写死的 235520k。
#         这是**真正卡住引导的那一处**：`-(ubi)` = "占完 NMBM 剩余全部"，
#         它的值取决于本 U-Boot 预留了多少 NMBM 块，与原厂不一致（本机更大）。
#         U-Boot 于是以超出真实 UBI 的范围 attach，把尾部空白擦除块收编成
#         free PEB 并挪动 volume table；而内核从自己的设备树里看到的仍是
#         235520 KiB 的分区，于是再也找不到那张表：
#             ubi0 error: ubi_read_volume_table: the layout volume was not found
#             ubi0 error: ubi_attach_mtd_dev: failed to attach mtd6, error -22
#         235520k 由三处独立证据共同确认：原厂 FIP 内置 mtdparts、原厂内核
#         DTB 的 partition@5C0000，以及 OpenWrt 官方 256MB 机型定义（IMAGE_SIZE）。
#
# 为什么开 MULTI_LAYOUT：
#   上游 bl-mt798x-dhcpd 本来就内置 CONFIG_MEDIATEK_MULTI_MTD_LAYOUT —— DTS 里为
#   同一块板定义多套分区表，运行时用 env `mtd_layout_label` 选一套，网页刷机时
#   也能选目标布局（/getmtdlayout + /upload 的 mtd_layout 字段）。128MB 版 Cudy
#   TR3000 上游已经支持，256MB 版没有，0004 把它补齐。
#
# 注意：存盘 env 里的 `mtdparts` 优先级高于设备树。若 u-boot-env 里躺着旧的
# `-(ubi)`，0006 会被它整个盖住 —— 详见 README 第六节第 2 步。

name: Build OEM-flashable U-Boot (FIP)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/weekdaycare/bl-mt798x-dhcpd
  # 钉死到已验证过的上游 commit，避免上游变更让补丁突然应用失败。
  # 想升级上游时，改这里并重新跑一次「校验补丁已生效」那一步确认即可。
  UPSTREAM_REF: f6b361ed80012244b1ed33be1b5080b4d65e83fb
  BOARD: cudy_tr3000-v1-256mb
  SOC: mt7981
  FIP_VERSION: "2025"
  VARIANT: default
  FIXED_MTDPARTS: "1"
  MULTI_LAYOUT: "1"
  # build.sh 找不到 multi-layout defconfig 时会 read 等待输入；CI 里没有 stdin。
  SILENT: "Y"
  PATCH_FILES: >-
    0001-uboot-add-oem-firmware-restore.patch
    0002-uboot-boot-vendor-layout.patch
    0003-uboot-auto-split-vendor-image.patch
    0004-uboot-multi-layout-cudy-256mb.patch
    0005-uboot-multi-layout-no-cmdline.patch
    0006-uboot-pin-factory-ubi-size.patch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 取出本仓库（含补丁）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 克隆上游 U-Boot 源码
        run: |
          set -e
          git clone "$UPSTREAM_REPO" src
          cd src
          git checkout --detach "$UPSTREAM_REF"
          echo "上游 commit：$(git rev-parse HEAD)"
          echo "src/ 顶层：$(ls | tr '\n' ' ')"

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get -qq update
          sudo apt-get -qq install $(cat src/depends/ubuntu-22.04)
          sudo apt-get -qq install rename tar

      - name: 依序应用补丁
        run: |
          set -e
          cd src
          for P in $PATCH_FILES; do
            F="$GITHUB_WORKSPACE/$P"
            test -f "$F" || { echo "找不到补丁：$F"; exit 1; }
            echo "==> 应用 $P"
            if git apply --verbose "$F"; then
              echo "    git apply 成功"
            elif git apply --ignore-whitespace "$F"; then
              echo "    git apply --ignore-whitespace 成功"
            else
              echo "    退回 patch -p1"
              patch -p1 -l < "$F"
            fi
          done

      - name: 校验补丁已生效
        run: |
          set -e
          U=src/uboot-mtk-20250711
          C=$U/board/mediatek/common

          # ---- 0001：原样直写原厂整包 UBI ----
          grep -q "mtd_part_has_ubi_image" "$C/mtd_helper.c"
          grep -q "generic_mtd_write_oem"  "$C/bootmenu_mtd_common.c"
          grep -q "generic_mtd_write_oem"  "$C/bootmenu_common.h"
          grep -q 'abbr = "oem"'           "$C/bootmenu_mtd.c"

          # ---- 0002：真的会引导 + vendor 引导参数钩子 ----
          grep -q 'env_set("bootcmd", "mtkboardboot")' "$C/bootmenu_mtd.c"
          grep -q "mtd_vendor_bootargs_setup"          "$C/mtd_helper.c"

          # ---- 0003：原厂整包自动切割 + 修掉删卷隐患 ----
          grep -q "find_ubi_payload"           "$C/bootmenu_mtd_common.c"
          grep -q "ubi_peb_guess"              "$C/bootmenu_mtd_common.c"
          grep -q "memset(&ii, 0, sizeof(ii))" "$C/mtd_helper.c"
          grep -qF 'if (!ret && ii.header_type == HEADER_FIT)' "$C/mtd_helper.c"

          # ---- 0004：Cudy TR3000 256MB 多布局 ----
          MLCFG="$U/configs/mt7981_cudy_tr3000-v1-256mb_multi_layout_defconfig"
          DTSF="$U/arch/arm/dts/mt7981-cudy-tr3000-v1-256mb.dts"
          test -f "$MLCFG"
          grep -q "CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y" "$MLCFG"
          grep -q "CONFIG_CMD_SHOW_MTD_LAYOUT=y"      "$MLCFG"
          ! grep -q "MTDPARTS_DEFAULT"                "$MLCFG"
          grep -q "mtd-layout"                                  "$DTSF"
          grep -q 'label = "default"'                           "$DTSF"
          grep -q 'label = "112m"'                              "$DTSF"
          grep -q "vendor_bootargs"                             "$C/mtd_helper.c"
          # 走 UBIFS 去挂 squashfs 的那组参数必须已经拿掉
          ! grep -q 'bootargs_set("ubi.rootfs_volume"'         "$C/mtd_helper.c"

          # ---- 0005：布局不再自带命令行 ----
          # env bootargs 一旦非空，fdt_chosen() 会整体替换 FIT 的 /chosen/bootargs；
          # 原厂 U-Boot 不设 bootargs，所以这里也必须不设。
          ! grep -q 'cmdline ='                                 "$DTSF"

          # ---- 0006：ubi 分区钉死成原厂尺寸 235520k ----
          # `-(ubi)` 算出来的值比原厂大，会让 U-Boot 把 UBI attach 到超出真实
          # 范围的地方并挪动 volume table，内核随后找不到（见文件头 0006 说明）。
          grep -q 'nmbm0:1024k(bl2),512k(u-boot-env),2048k(Factory),256k(bdinfo),2048k(fip),235520k(ubi)' "$DTSF"
          ! grep -q '2048k(fip),-(ubi)'                          "$DTSF"
          # 112m 布局不受 0006 影响，仍是写死的 114688k
          grep -q '2048k(fip),114688k(ubi)'                      "$DTSF"

          echo "==> 补丁校验通过：六个补丁全部命中"

      - name: 编译 FIP
        run: |
          set -eo pipefail
          cd src
          BOARD="$BOARD" SOC="$SOC" VERSION="$FIP_VERSION" VARIANT="$VARIANT" \
            MULTI_LAYOUT="$MULTI_LAYOUT" FIXED_MTDPARTS="$FIXED_MTDPARTS" \
            SILENT="$SILENT" ./build.sh 2>&1 | tee ../build.log

      - name: 生成校验和
        run: |
          set -e
          (cd src/output && md5sum *.bin > MD5SUMS.txt && cat MD5SUMS.txt)

      - name: 打印关键信息
        if: always()
        run: |
          grep -m1 "Features:" build.log || true
          grep -m1 "U-Boot CFG:" build.log || true
          grep -m1 "VARIANT:" build.log || true
          ls -l src/output || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fip-cudy-tr3000-v1-256mb-multi-layout
          path: |
            src/output/*.bin
            src/output/MD5SUMS.txt
            build.log
          if-no-files-found: error
          retention-days: 90
